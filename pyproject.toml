[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rixo-workspace"
version = "0.1.0"
description = "Local packages for the RIXO FastAPI runtime."

[tool.setuptools.packages.find]
include = ["agent*", "data*", "detection*", "evaluation*", "models*", "tools*"]

[tool.vercel]
entrypoint = "main:app"
